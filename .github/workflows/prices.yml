name: Coletar tarifas (SerpApi Google Flights)

on:
  schedule:
    - cron: "30 11 * * *"   # 08:30 BRT, antes da leitura diária do radar (09:08 BRT)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Consultar tarifas
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python fetch_prices.py
      - name: Commit dos resultados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add prices.json serpapi_account.json history/ raw/
          git diff --cached --quiet && echo "sem mudanças" || git commit -m "tarifas $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push
